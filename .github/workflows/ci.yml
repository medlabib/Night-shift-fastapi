name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # A new push supersedes the run in flight for the same branch.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nightshift
          POSTGRES_PASSWORD: nightshift
          POSTGRES_DB: nightshift_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U nightshift"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://nightshift:nightshift@127.0.0.1:5433/nightshift_test
      SECRET_KEY: ci-secret-not-for-production
      # One worker, so a solve returns the same one of its equally-optimal
      # rotas every run. With several workers racing, CP-SAT reaches the same
      # score but a different rota each time, and tests that read the rota
      # itself flake on a shared runner.
      SOLVER_WORKERS: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # WeasyPrint renders through Pango and Cairo, which are system libraries
      # rather than Python packages, so the PDF tests need them installed.
      - name: Install PDF system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b \
            libcairo2 libgdk-pixbuf-2.0-0 shared-mime-info \
            fonts-dejavu-core fonts-noto-core

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Check migrations match the models
        run: |
          alembic upgrade head
          # A model change without a migration shows up here rather than on a
          # production deploy: autogenerate must find nothing left to do.
          alembic check

      - name: Run tests
        run: pytest -q
